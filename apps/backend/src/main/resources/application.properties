# -------------------------------------------------------------------------
# CONFIGURACIÓN DEL SERVIDOR
# -------------------------------------------------------------------------
server.port=3000

# -------------------------------------------------------------------------
# CONFIGURACIÓN DE BASE DE DATOS (Supabase Direct Connection)
# -------------------------------------------------------------------------
# NOTA 1: Hemos quitado "?user=..." de la URL porque Spring ya usa las variables de abajo.
# NOTA 2: Usamos el puerto 5432 (Direct Connection)
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres
spring.datasource.username=postgres.yrjrlrhznvpgvscnnkut
spring.datasource.password=CieloSol1122
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------------
# CONFIGURACIÓN JPA / HIBERNATE
# -------------------------------------------------------------------------
# Definimos el dialecto explícitamente para que Hibernate no intente adivinarlo fallando
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ajustes para el Pooler de Supabase (Evita desconexiones)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# -------------------------------------------------------------------------
# CORS (Permitir conexión desde el Frontend)
# -------------------------------------------------------------------------
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true