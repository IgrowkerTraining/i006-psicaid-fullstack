version: '3.8'

services:
  backend:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      # Inject these via CI/CD pipelines or Render/AWS dashboards
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=production
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - psicaid-backend-network

networks:
  psicaid-backend-network:
    name: psicaid-backend-prod-network
